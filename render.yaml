services:
  - type: web
    name: schooltrack-demo
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_WRITES_ENABLED
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        sync: false
